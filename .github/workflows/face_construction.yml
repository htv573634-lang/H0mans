name: Face Construction Pipeline (DECA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Inputs/face/**'

jobs:
  build-face:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==1.13.1 torchvision==0.14.1 numpy==1.23.5
          python -c "import torch; print('Torch:', torch.__version__); import numpy; print('NumPy:', numpy.__version__)"

      - name: Install chumpy (legacy FLAME loader)
        run: |
          pip install chumpy==0.70 --no-build-isolation

      - name: Install DECA Dependencies
        run: |
          pip install -r requirements.txt
          pip install gdown

      - name: Install pytorch3d (Multi-Strategy)
        run: |
          echo "=== Strategy 1: Pre-built CPU wheel ==="
          pip install --extra-index-url https://miropsota.github.io/torch_packages_builder "pytorch3d==0.7.5+pt1.13.1cpu" && exit 0
          
          echo "=== Strategy 2: Build from source with --no-build-isolation ==="
          pip install --no-build-isolation "git+https://github.com/facebookresearch/pytorch3d.git@v0.7.4"
          
          python -c "import pytorch3d; print('pytorch3d version:', pytorch3d.__version__)"

      - name: Clone DECA Repository
        run: |
          git clone https://github.com/YadiraF/DECA.git

      - name: Patch DECA for CPU & Newer APIs
        run: |
          echo "=== Patching enum names ==="
          find DECA -name "*.py" -exec sed -i 's/LandmarksType\._2D/LandmarksType.TWO_D/g' {} \;
          find DECA -name "*.py" -exec sed -i 's/LandmarksType\._3D/LandmarksType.THREE_D/g' {} \;
          
          echo "=== Patching FaceAlignment to use CPU ==="
          sed -i "s/face_alignment.FaceAlignment(face_alignment.LandmarksType.TWO_D, flip_input=False)/face_alignment.FaceAlignment(face_alignment.LandmarksType.TWO_D, flip_input=False, device='cpu')/g" DECA/decalib/datasets/detectors.py
          
          echo "=== Patching ALL cuda references to cpu ==="
          find DECA -name "*.py" -exec sed -i "s|torch.device('cuda:0')|torch.device('cpu')|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|torch.device("cuda:0")|torch.device("cpu")|g' {} \;
          find DECA -name "*.py" -exec sed -i "s|torch.device('cuda')|torch.device('cpu')|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|torch.device("cuda")|torch.device("cpu")|g' {} \;
          find DECA -name "*.py" -exec sed -i "s|= *'cuda:0'|= 'cpu'|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|= *"cuda:0"|= "cpu"|g' {} \;
          find DECA -name "*.py" -exec sed -i "s|= *'cuda'|= 'cpu'|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|= *"cuda"|= "cpu"|g' {} \;
          find DECA -name "*.py" -exec sed -i "s|default='cuda'|default='cpu'|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|default="cuda"|default="cpu"|g' {} \;
          find DECA -name "*.py" -exec sed -i "s|\.cuda()|.cpu()|g" {} \;
          find DECA -name "*.py" -exec sed -i "s|'cuda:0'|'cpu'|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|"cuda:0"|"cpu"|g' {} \;

      - name: Download All Required Data Files
        run: |
          cd DECA
          mkdir -p data
          
          echo "=== Downloading DECA model weights ==="
          gdown --id 1rp8kdyLPvErw2dTmqtjISRVvQLj6Yzje -O data/deca_model.tar || echo "deca_model.tar download failed"
          
          echo "=== Downloading FLAME_albedo_from_BFM.npz (multiple fallback sources) ==="
          # Fallback 1: DECA's GitHub raw
          curl -L -o data/FLAME_albedo_from_BFM.npz \
            "https://github.com/YadiraF/DECA/raw/master/data/FLAME_albedo_from_BFM.npz" || echo "Source 1 failed"
          
          # Verify it's a real file (not an HTML error page)
          FILE_SIZE=$(stat -c%s "data/FLAME_albedo_from_BFM.npz" 2>/dev/null || echo 0)
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "File too small ($FILE_SIZE bytes) - trying alternative source"
            
            # Fallback 2: Your GitHub release (if you upload it)
            curl -L -o data/FLAME_albedo_from_BFM.npz \
              "https://github.com/htv573634-lang/H0mans/releases/download/FemaleV1/FLAME_albedo_from_BFM.npz" || echo "Source 2 failed"
          fi
          
          echo "=== Downloading FLAME models from your release ==="
          curl -L -o data/generic_model.pkl https://github.com/htv573634-lang/H0mans/releases/download/FemaleV1/generic_model.pkl || echo "Generic model download failed"
          curl -L -o data/female_model.pkl https://github.com/htv573634-lang/H0mans/releases/download/FemaleV1/female_model.pkl || echo "Female model download failed"
          
          echo "=== Data directory contents ==="
          ls -la data/

      - name: Run Face Construction Script
        env:
          CUDA_VISIBLE_DEVICES: ""
          MPLBACKEND: "Agg"
        run: |
          python codes/face/run_deca.py --input_dir Inputs/face --output_dir output --deca_path ./DECA

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-mesh-output
          path: output/
