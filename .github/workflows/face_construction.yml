name: Face Construction Pipeline (DECA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Inputs/face/**'

jobs:
  build-face:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==1.13.1 torchvision==0.14.1 numpy==1.23.5

      - name: Install chumpy (legacy FLAME loader)
        run: pip install chumpy==0.70 --no-build-isolation

      - name: Install DECA Dependencies
        run: |
          pip install -r requirements.txt
          pip install gdown

      - name: Install pytorch3d
        run: |
          pip install --extra-index-url https://miropsota.github.io/torch_packages_builder "pytorch3d==0.7.5+pt1.13.1cpu" && exit 0
          pip install --no-build-isolation "git+https://github.com/facebookresearch/pytorch3d.git@v0.7.4"

      - name: Clone DECA Repository
        run: git clone https://github.com/YadiraF/DECA.git

      - name: Patch DECA for CPU & Newer APIs
        run: |
          echo "=== Patch 1: Enum names ==="
          find DECA -name "*.py" -exec sed -i 's/LandmarksType\._2D/LandmarksType.TWO_D/g' {} \;
          find DECA -name "*.py" -exec sed -i 's/LandmarksType\._3D/LandmarksType.THREE_D/g' {} \;
          
          echo "=== Patch 2: FaceAlignment CPU device ==="
          sed -i "s/face_alignment.FaceAlignment(face_alignment.LandmarksType.TWO_D, flip_input=False)/face_alignment.FaceAlignment(face_alignment.LandmarksType.TWO_D, flip_input=False, device='cpu')/g" DECA/decalib/datasets/detectors.py
          
          echo "=== Patch 3: np.load allow_pickle ==="
          find DECA -name "*.py" -exec sed -i "s/np\.load(tex_path)/np.load(tex_path, allow_pickle=True)/g" {} \;
          
          echo "=== Patch 4: torch.load map_location=cpu ==="
          # This is the fix for the CUDA deserialize error
          find DECA -name "*.py" -exec sed -i "s/torch\.load(model_path)/torch.load(model_path, map_location='cpu')/g" {} \;
          # Broad sweep for any torch.load without map_location
          find DECA -name "*.py" -exec sed -i "s/torch\.load(\([^,)]*\))/torch.load(\1, map_location='cpu')/g" {} \;
          # Fix any double-added map_location (in case it was already specified)
          find DECA -name "*.py" -exec sed -i "s/map_location='cpu', map_location='cpu'/map_location='cpu'/g" {} \;
          find DECA -name "*.py" -exec sed -i 's/map_location="cpu", map_location="cpu"/map_location="cpu"/g' {} \;
          
          echo "=== Patch 5: Device strings ==="
          find DECA -name "*.py" -exec sed -i "s|torch.device('cuda:0')|torch.device('cpu')|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|torch.device("cuda:0")|torch.device("cpu")|g' {} \;
          find DECA -name "*.py" -exec sed -i "s|torch.device('cuda')|torch.device('cpu')|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|torch.device("cuda")|torch.device("cpu")|g' {} \;
          find DECA -name "*.py" -exec sed -i "s|= *'cuda'|= 'cpu'|g" {} \;
          find DECA -name "*.py" -exec sed -i 's|= *"cuda"|= "cpu"|g' {} \;
          find DECA -name "*.py" -exec sed -i "s|\.cuda()|.cpu()|g" {} \;
          
          echo "=== Verification: torch.load in deca.py ==="
          grep -n "torch.load" DECA/decalib/deca.py

      - name: Download Data Files
        run: |
          cd DECA
          mkdir -p data
          
          echo "=== Downloading DECA model weights ==="
          gdown 1rp8kdyLPvErw2dTmqtjISRVvQLj6Yzje -O data/deca_model.tar
          
          echo "=== Downloading FLAME_albedo_from_BFM.npz ==="
          curl -L -o data/FLAME_albedo_from_BFM.npz "https://huggingface.co/camenduru/BFM/resolve/main/FLAME_albedo_from_BFM.npz"
          
          echo "=== Downloading FLAME models from your release ==="
          curl -L -o data/generic_model.pkl https://github.com/htv573634-lang/H0mans/releases/download/FemaleV1/generic_model.pkl
          curl -L -o data/female_model.pkl https://github.com/htv573634-lang/H0mans/releases/download/FemaleV1/female_model.pkl
          
          echo "=== Data directory contents ==="
          ls -la data/

      - name: Verify FLAME Albedo File
        run: python codes/face/verify_npz.py DECA/data/FLAME_albedo_from_BFM.npz

      - name: Run Face Construction Script
        env:
          CUDA_VISIBLE_DEVICES: ""
          MPLBACKEND: "Agg"
        run: |
          python codes/face/run_deca.py --input_dir Inputs/face --output_dir output --deca_path ./DECA

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-mesh-output
          path: output/
