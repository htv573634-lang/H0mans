name: Face Construction Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'Inputs/face/**'

jobs:
  build-face:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clone 3DDFA_v2 Repository
        run: |
          git clone https://github.com/cleardusk/3DDFA_V2.git

      - name: Build 3DDFA_v2 Extensions
        run: |
          cd 3DDFA_V2
          sh ./build.sh

      - name: Download Pre-trained Weights
        run: |
          cd 3DDFA_V2
          sh ./download_weights.sh

      - name: Run Face Construction Script
        run: |
          python codes/face/run_3ddfa.py --input_dir Inputs/face --output_dir output --ddfa_path ./3DDFA_V2

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-mesh-output
          path: output/
