name: Face Construction Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'Inputs/face/**'

jobs:
  build-face:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Models from Release
        run: |
          mkdir -p models
          curl -L -o models/female_model.pkl https://github.com/htv573634-lang/H0mans/releases/download/FemaleV1/female_model.pkl
          curl -L -o models/FLAME_masks.pkl https://github.com/htv573634-lang/H0mans/releases/download/FemaleV1/FLAME_masks.pkl
          curl -L -o models/mica.tar https://github.com/htv573634-lang/H0mans/releases/download/FemaleV1/mica.tar

      - name: Clone MICA Repository
        run: |
          git clone https://github.com/Zielon/MICA.git

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install MICA's official dependencies
          pip install -r MICA/requirements.txt
          # Install extra tools we need for conversion
          pip install trimesh

      - name: Run Face Construction Script
        run: |
          # Pass the cloned MICA directory to our script
          python codes/face/run_mica.py --input_dir Inputs/face --output_dir output --mica_path ./MICA --model_path ./models/mica.tar

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-mesh-output
          path: output/
