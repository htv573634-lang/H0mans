name: Face Construction Pipeline (DECA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Inputs/face/**'

jobs:
  build-face:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-glx libglib2.0-0

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import torch; print('Torch:', torch.__version__); import numpy; print('NumPy:', numpy.__version__)"

      - name: Install pytorch3d (Multi-Strategy)
        run: |
          # Strategy 1: Try pre-built wheel from miropsota repository (fastest)
          echo "=== Strategy 1: Trying pre-built wheel ==="
          pip install --extra-index-url https://miropsota.github.io/torch_packages_builder pytorch3d==0.7.4+pt1.13.1 && exit 0
          
          # Strategy 2: Try another version of the wheel
          echo "=== Strategy 2: Trying alternative wheel version ==="
          pip install --extra-index-url https://miropsota.github.io/torch_packages_builder pytorch3d==0.7.5+pt1.13.1 && exit 0
          
          # Strategy 3: Build from source (most reliable fallback)
          echo "=== Strategy 3: Building pytorch3d from source (this takes ~5-10 min) ==="
          pip install "git+https://github.com/facebookresearch/pytorch3d.git@v0.7.4"
          
          # Verify installation
          python -c "import pytorch3d; print('pytorch3d version:', pytorch3d.__version__)"

      - name: Clone DECA Repository
        run: |
          git clone https://github.com/YadiraF/DECA.git

      - name: Download Pre-trained Models
        run: |
          cd DECA
          mkdir -p data
          pip install gdown
          
          echo "=== Downloading DECA model weights ==="
          gdown --id 1rp8kdyLPvErw2dTmqtjISRVvQLj6Yzje -O data/deca_model.tar || echo "DECA model download failed"
          
          echo "=== Downloading FLAME models ==="
          # Try to download generic_model.pkl (may fail due to registration requirements)
          wget -q -O data/generic_model.pkl "https://github.com/YadiraF/DECA/raw/master/data/generic_model.pkl" || echo "Generic model needs manual upload"
          
          echo "=== Data directory contents ==="
          ls -la data/

      - name: Run Face Construction Script
        env:
          CUDA_VISIBLE_DEVICES: ""
          MPLBACKEND: "Agg"
        run: |
          python codes/face/run_deca.py --input_dir Inputs/face --output_dir output --deca_path ./DECA

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-mesh-output
          path: output/
